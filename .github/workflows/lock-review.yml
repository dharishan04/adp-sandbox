# A submitted or dismissed review re-runs the PR's own Lock run. Its job has a
# different name: a skipped or extra `lock` result would count toward the
# required check (a skipped required check reads as passing).
name: lock-review
on:
  pull_request_review:
    types: [submitted, dismissed]
permissions: { contents: read, actions: write }
jobs:
  lock-rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node gates/rerun.ts lock.yml
        env: { GH_TOKEN: '${{ github.token }}' }
