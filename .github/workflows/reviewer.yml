# Reviewer lane, GitHub half: each push resets the `review` check to "awaiting"
# as the reviewer App. The review itself runs in Claude Code on the lead's
# laptop (lanes/local-review.ts), and its round comes back through post-review.
name: reviewer
on:
  pull_request:
    branches: [main, 'epic/**']
    types: [opened, synchronize, reopened]
permissions: { contents: read }
jobs:
  await:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_APP_KEY }}
      - run: node lanes/await-review.ts
        env: { GH_TOKEN: '${{ steps.app.outputs.token }}' }
